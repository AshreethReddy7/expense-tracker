<!DOCTYPE html>
<html>
<head>
    <title>Transaction Report</title>

    <style>

        table{
            width:100%;
            border-collapse: collapse;
        }

        th, td{
            border:1px solid black;
            padding:10px;
            text-align:center;
        }

        th{
            background-color:#f2f2f2;
        }

    </style>

</head>
<body>

<h2>Transaction Report</h2>

<table>

<tr>
    <th>ID</th>
    <th>Account Code</th>
    <th>Account Name</th>
    <th>Date</th>
    <th>Type</th>
    <th>Amount</th>
    <th>Remarks</th>
</tr>

{% for row in data %}

<tr>
    <td>{{ row[0] }}</td>
    <td>{{ row[1] }}</td>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
    <td>{{ row[4] }}</td>
    <td>{{ row[5] }}</td>
    <td>{{ row[6] }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
