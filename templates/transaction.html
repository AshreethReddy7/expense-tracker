<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transaction Entry</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: #f4f6f9;
            padding: 40px;
        }

        .container{
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 0px 15px rgba(0,0,0,0.1);
        }

        h2{
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group{
            margin-bottom: 18px;
        }

        label{
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #444;
        }

        input,
        select,
        textarea{
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input:focus,
        select:focus,
        textarea:focus{
            border-color: #007bff;
            outline: none;
        }

        textarea{
            resize: vertical;
            min-height: 80px;
        }

        .readonly{
            background-color: #f1f1f1;
        }

        .required{
            color: red;
        }

        .btn{
            width: 100%;
            padding: 14px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover{
            background: #0056b3;
        }

        .top-info{
            background: #eef4ff;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            color: #333;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Transaction Entry Form</h2>

    <div class="top-info">

        <strong>Account Transaction Entry</strong><br>
        Fill transaction details carefully.

    </div>

    <form action="/save_transaction" method="POST">

        <div class="form-group">

            <label>
                Account Code
                <span class="required">*</span>
            </label>

            <input type="text"
                   name="account_code"
                   value="{{ account_code }}"
                   class="readonly"
                   readonly>

        </div>

        <div class="form-group">

            <label>
                Account Name
                <span class="required">*</span>
            </label>

            <input type="text"
                   name="account_name"
                   value="{{ account_name }}"
                   class="readonly"
                   readonly>

        </div>

        <div class="form-group">

            <label>
                Transaction Date
                <span class="required">*</span>
            </label>

            <input type="date"
                   name="transaction_date"
                   required>

        </div>

        <div class="form-group">

            <label>
                Transaction Type
                <span class="required">*</span>
            </label>

            <select name="transaction_type" required>

                <option value="">
                    Select Transaction Type
                </option>

                <option value="Debit">
                    Debit
                </option>

                <option value="Credit">
                    Credit
                </option>

            </select>

        </div>

        <div class="form-group">

            <label>
                Amount
                <span class="required">*</span>
            </label>

            <input type="number"
                   step="0.01"
                   name="amount"
                   placeholder="Enter Amount"
                   required>

        </div>

        <div class="form-group">

            <label>
                Remarks
            </label>

            <textarea name="remarks"
                      placeholder="Enter Remarks"></textarea>

        </div>

        <button type="submit" class="btn">

            Save Transaction

        </button>

    </form>

</div>

</body>
</html>
