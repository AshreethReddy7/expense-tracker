```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Entry Form</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        .container{
            width: 500px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        h2{
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group{
            margin-bottom: 15px;
        }

        label{
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }

        input{
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus{
            border-color: #007bff;
            outline: none;
        }

        button{
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover{
            background-color: #0056b3;
        }

        .required{
            color: red;
        }

    </style>
</head>

<body>

<div class="container">

    <h2>Account Entry Form</h2>

    <form action="/submit_account" method="POST">

        <div class="form-group">
            <label>Account Code <span class="required">*</span></label>
            <input type="text" name="account_code" placeholder="Account Code" required>
        </div>

        <div class="form-group">
            <label>Account Name <span class="required">*</span></label>
            <input type="text" name="account_name" placeholder="Account Name" required>
        </div>

        <div class="form-group">
            <label>PL / BS <span class="required">*</span></label>
            <input type="text" name="pl_bs" placeholder="PL/BS" required>
        </div>

        <div class="form-group">
            <label>Account Group <span class="required">*</span></label>
            <input type="text" name="account_group" placeholder="Account Group" required>
        </div>

        <div class="form-group">
            <label>Account Sub Group <span class="required">*</span></label>
            <input type="text" name="account_sub_group" placeholder="Account Sub Group" required>
        </div>

        <div class="form-group">
            <label>Account Type <span class="required">*</span></label>
            <input type="text" name="account_type" placeholder="Account Type" required>
        </div>

        <div class="form-group">
            <label>GST Number <span class="required">*</span></label>
            <input type="text" name="gst_number"
                   placeholder="GST Number"
                   pattern="[0-9A-Z]{15}"
                   title="Enter valid GST Number"
                   required>
        </div>

        <div class="form-group">
            <label>PAN Number</label>
            <input type="text"
                   name="pan_number"
                   placeholder="PAN Number"
                   pattern="[A-Z]{5}[0-9]{4}[A-Z]{1}"
                   title="Enter valid PAN Number">.
        </div>

        <div class="form-group">
            <label>Address <span class="required">*</span></label>
            <input type="text" name="address" placeholder="Address" required>
        </div>

        <div class="form-group">
            <label>City <span class="required">*</span></label>
            <input type="text" name="city" placeholder="City" required>
        </div>

        <div class="form-group">
            <label>State <span class="required">*</span></label>
            <input type="text" name="state" placeholder="State" required>
        </div>

        <div class="form-group">
            <label>PIN Code <span class="required">*</span></label>
            <input type="text"
                   name="pin"
                   placeholder="PIN Code"
                   pattern="[0-9]{6}"
                   title="Enter 6 digit PIN Code"
                   required>
        </div>

        <div class="form-group">
            <label>Country <span class="required">*</span></label>
            <input type="text" name="country" placeholder="Country" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="Email">
        </div>

        <div class="form-group">
            <label>Phone <span class="required">*</span></label>
            <input type="text"
                   name="phone"
                   placeholder="Phone Number"
                   pattern="[0-9]{10}"
                   title="Enter 10 digit mobile number"
                   required>
        </div>

        <button type="submit">Save Account</button>

    </form>

</div>

</body>
</html>
